# Snowflake-Labs MCP server (uvx snowflake-labs-mcp), used by .mcp.json.
# Read-only: only the SQL query tool, and only SELECT / DESCRIBE / SHOW statements.
# The real boundary is the PBI_READER role the PAT is restricted to (docs/SNOWFLAKE_SETUP.md).
agent_services: []
search_services: []
analyst_services: []
other_services:
  object_manager: False
  query_manager: True
  semantic_manager: False
sql_statement_permissions:
  - Select: True
  - Describe: True
  - Show: True
  - Command: False
  - Alter: False
  - Comment: False
  - Commit: False
  - Create: False
  - Delete: False
  - Drop: False
  - Insert: False
  - Merge: False
  - Rollback: False
  - Transaction: False
  - TruncateTable: False
  - Unknown: False
  - Update: False
  - Use: False
