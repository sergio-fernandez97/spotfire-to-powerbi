[project]
name = "dxp2pbi"
version = "0.1.0"
description = "Parse Spotfire .dxp analyses into a migration spec and a Power BI TMDL semantic model"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
dxp2pbi = "dxp2pbi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dxp2pbi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
